# Render Blueprint: the whole app (frontend + API) in one Docker service, one URL.
# Render dashboard -> New -> Blueprint -> pick this repo -> paste the secret values it asks for.
services:
  - type: web
    name: rafiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # free sleeps after 15 min without visits (first load then takes ~1 min). "starter" stays awake.
    healthCheckPath: /api/health
    envVars:
      - key: DEV_MODE
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: COUNTRY
        value: TN
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: VISION_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_SERVER_KEY
        sync: false
      - key: GOOGLE_BROWSER_KEY
        sync: false
      - key: GOOGLE_MAP_ID
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
